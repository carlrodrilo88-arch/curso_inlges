<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ruta Inglés Dev</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: una columna de estudio (max 1040px) con barra de pestañas fija; la ruta A1→C2 es la columna vertebral visual. */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --sunk:#E9EDF6; --ink:#141A2E; --muted:#59627F; --line:#D9DFEB;
  --accent:#2C4BDB; --accent-ink:#FFFFFF; --accent-soft:#E5EAFF; --mark:#E9A426; --mark-soft:#FFF3DA;
  --ok:#1D8556; --ok-soft:#DDF3E8; --bad:#C23B35; --bad-soft:#FBE4E2;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1220; --surface:#161B2E; --sunk:#1C2238; --ink:#E7EAF4; --muted:#9AA3C2; --line:#2A3150;
  --accent:#8199FF; --accent-ink:#0E1220; --accent-soft:#1F2850; --mark:#F2B847; --mark-soft:#3A2F17;
  --ok:#4CC48B; --ok-soft:#163528; --bad:#F27A70; --bad-soft:#3D1E1D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1220; --surface:#161B2E; --sunk:#1C2238; --ink:#E7EAF4; --muted:#9AA3C2; --line:#2A3150;
  --accent:#8199FF; --accent-ink:#0E1220; --accent-soft:#1F2850; --mark:#F2B847; --mark-soft:#3A2F17;
  --ok:#4CC48B; --ok-soft:#163528; --bad:#F27A70; --bad-soft:#3D1E1D; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(1.7rem,4vw,2.4rem);font-weight:800;letter-spacing:-.01em}
h2{font-size:1.45rem;font-weight:700}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:.82rem}
.label{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.15rem}
.brand .logo{width:32px;height:32px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-mono);font-size:.8rem;font-weight:600}
nav.tabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap;color:var(--muted);font-weight:700}
nav.tabs button:hover{background:var(--sunk);color:var(--ink)}
nav.tabs button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.status{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.72rem;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--mark-soft);color:var(--ink)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}

main{padding-block:28px 64px;display:grid;gap:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px}
.stack{display:grid;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:10px;cursor:pointer;font-weight:700;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:5px 10px;font-size:.88rem;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}
.levelmark{font-family:var(--f-display);font-weight:800;font-size:4.2rem;line-height:1;color:var(--accent);letter-spacing:-.03em}
.levelmark small{display:block;font-family:var(--f-mono);font-size:.72rem;font-weight:400;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.hero .body{display:grid;gap:10px;min-width:0}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px}
@media (max-width:560px){.hero{grid-template-columns:1fr}.levelmark{font-size:3.2rem}}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat b{display:block;font-family:var(--f-display);font-size:1.7rem;font-variant-numeric:tabular-nums}

/* CEFR ladder */
.ladder{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.ladder div{text-align:center;padding:6px 0;border-radius:6px;background:var(--sunk);font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.ladder div.passed{background:var(--ok-soft);color:var(--ok);font-weight:600}
.ladder div.now{background:var(--accent);color:var(--accent-ink);font-weight:600}

.log{list-style:none;margin:0;padding:0;display:grid}
.log li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);align-items:baseline}
.log li:last-child{border-bottom:0}
.log .h{font-family:var(--f-mono);font-size:.75rem;color:var(--accent)}
.log .s{font-family:var(--f-mono);font-size:.8rem;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:.9rem;background:var(--sunk)}
.chip b{font-family:var(--f-mono);font-size:.78rem;color:var(--bad);margin-left:4px}
.coach{white-space:pre-wrap;line-height:1.6}

/* route */
.level{display:grid;grid-template-columns:120px 1fr;gap:20px;padding-block:22px;border-top:1px solid var(--line)}
.level:first-of-type{border-top:0}
.level .code{font-family:var(--f-display);font-weight:800;font-size:3rem;line-height:1;color:var(--accent)}
.level.locked .code{color:var(--muted);opacity:.6}
.level .meta{display:grid;gap:6px;align-content:start}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px;margin-top:14px}
.unit{display:grid;gap:6px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.unit:hover:not(:disabled){border-color:var(--accent)}
.unit:disabled{cursor:not-allowed;opacity:.55}
.unit .n{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.unit .t{font-weight:700;line-height:1.3}
.unit .g{font-size:.86rem;color:var(--muted);line-height:1.35}
.unit.done{border-color:var(--ok)}
@media (max-width:640px){.level{grid-template-columns:1fr;gap:8px}.level .code{font-size:2.2rem}}

/* lesson */
.crumbs{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lesson-head{display:grid;gap:10px}
.focus{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.focus div{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:.92rem}
.prose{max-width:68ch;white-space:pre-wrap}
.rule{border-left:3px solid var(--mark);padding-left:14px;display:grid;gap:6px}
.ex-en{font-weight:700}
.ex-es{color:var(--muted);font-size:.92rem}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:400}
td.en{font-weight:700;white-space:nowrap}
.say{border:0;background:var(--accent-soft);color:var(--accent);border-radius:7px;width:30px;height:30px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.say svg{width:16px;height:16px;fill:currentColor}
.dlg{display:grid;gap:10px}
.dlg .ln{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start}
.who{font-family:var(--f-mono);font-size:.78rem;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);font-weight:600}
.who.b{background:var(--mark-soft)}
ol.exs{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:ex}
.ex{counter-increment:ex;border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px}
.ex .q::before{content:counter(ex) ". ";font-family:var(--f-mono);color:var(--muted)}
.ex.ok{border-color:var(--ok);background:var(--ok-soft)}
.ex.bad{border-color:var(--bad);background:var(--bad-soft)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);padding:6px 12px;border-radius:8px;cursor:pointer}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.opt.right{border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.wrong{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.opt:disabled{cursor:default}
input.fill,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;max-width:420px}
textarea{max-width:none;min-height:150px;resize:vertical;line-height:1.5}
.why{font-size:.9rem;color:var(--muted)}
.ans{font-size:.9rem}
.result{border-radius:12px;padding:16px;display:grid;gap:10px;border:1px solid var(--line);background:var(--sunk)}
.result.pass{background:var(--ok-soft);border-color:var(--ok)}
.score{font-family:var(--f-display);font-weight:800;font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}
.err-list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.err-list li{background:var(--surface);border-radius:8px;padding:8px 10px;border:1px solid var(--line)}
.err-list s{color:var(--bad)}
.err-list ins{color:var(--ok);text-decoration:none;font-weight:700}
.thinking{display:flex;gap:10px;align-items:center;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1.1s infinite ease-in-out}
@keyframes pulse{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.note{background:var(--mark-soft);border-radius:10px;padding:12px 14px;font-size:.95rem}
.errtxt{color:var(--bad);font-size:.95rem}
.rep-btn{background:none;border:0;padding:0;color:var(--muted);font-size:.82rem;text-decoration:underline;cursor:pointer;justify-self:start}
.rep-btn:hover{color:var(--bad)}
.rep-done{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.rep-form{display:grid;gap:8px;width:100%}
.rep-form textarea{min-height:70px}
.reps{list-style:none;margin:0;padding:0;display:grid}
.reps li{display:grid;grid-template-columns:auto 1fr auto;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);align-items:start}
.reps li:last-child{border-bottom:0}
.reps .what{min-width:0;display:grid;gap:2px;font-size:.92rem}
.reps .what small{color:var(--muted);overflow-wrap:anywhere}

/* talk */
.talk{display:grid;grid-template-columns:280px 1fr;gap:20px;align-items:start}
@media (max-width:800px){.talk{grid-template-columns:1fr}}
.scen{display:grid;gap:8px}
.scen button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer;display:grid;gap:2px}
.scen button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.scen small{color:var(--muted);font-size:.85rem;line-height:1.35}
.chat{display:grid;gap:12px;min-height:260px;max-height:62vh;overflow-y:auto;padding:4px}
.msg{max-width:min(85%,560px);padding:10px 14px;border-radius:14px;display:grid;gap:6px;min-width:0;overflow-wrap:anywhere}
.msg.bot{background:var(--sunk);justify-self:start;border-bottom-left-radius:4px}
.msg.me{background:var(--accent);color:var(--accent-ink);justify-self:end;border-bottom-right-radius:4px}
.fix{justify-self:end;max-width:min(85%,560px);font-size:.88rem;background:var(--mark-soft);border-radius:10px;padding:8px 12px;white-space:pre-wrap}
.composer{display:flex;gap:10px;align-items:flex-end}
.composer textarea{min-height:52px;height:52px}

/* plan */
.timeline{display:grid;gap:8px}
.tl{display:grid;grid-template-columns:48px 1fr 120px;gap:12px;align-items:center}
.tl .track{height:22px;background:var(--sunk);border-radius:6px;position:relative;overflow:hidden}
.tl .track span{position:absolute;top:0;bottom:0;background:var(--accent);border-radius:6px;opacity:.85}
.tl .track span.b2{background:var(--mark)}
.tl b{font-family:var(--f-mono)}
.tl .when{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.week{display:grid;gap:0}
.week div{display:grid;grid-template-columns:52px 1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.week div:last-child{border-bottom:0}
.week b{font-family:var(--f-mono);font-size:.8rem;color:var(--accent)}
ul.plain{margin:0;padding-left:18px;display:grid;gap:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;font-family:var(--f-mono);font-size:.82rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.model{border-left:3px solid var(--accent);padding-left:14px;display:grid;gap:6px}
details.hints{background:var(--mark-soft);border-radius:10px;padding:10px 14px}
details.hints summary{cursor:pointer;font-weight:700}
details.hints ul{margin-top:8px}
.notyet{font-family:var(--f-mono);font-size:.72rem;background:var(--sunk);color:var(--muted);border-radius:999px;padding:1px 8px;margin-left:6px}
.ref{border-left:4px solid var(--ok)}
.ref h4{font-family:var(--f-display);font-size:1rem;margin:0}
.ref .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:16px}
.ref .fine{font-size:.86rem;color:var(--muted);max-width:75ch}
details.fixes{background:var(--sunk);border-radius:10px;padding:10px 14px;font-size:.92rem}
details.fixes summary{cursor:pointer;font-weight:700}
/* repaso espaciado */
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--mark);color:#141A2E;font-family:var(--f-mono);font-size:.72rem;line-height:18px;text-align:center;margin-left:4px;font-weight:600}
.rv-card{display:grid;gap:16px;padding:24px;max-width:720px;width:100%;justify-self:center}
.rv-front{font-family:var(--f-display);font-weight:700;font-size:clamp(1.3rem,3.5vw,1.8rem);line-height:1.25;overflow-wrap:anywhere}
.rv-back{border-top:1px dashed var(--line);padding-top:14px}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades .btn{justify-content:center}
@media (max-width:520px){.grades{grid-template-columns:1fr}}
.kbd{font-family:var(--f-mono);font-size:.7rem;border:1px solid currentColor;border-radius:4px;padding:0 5px;opacity:.6}
@media (pointer:coarse){.kbd{display:none}}
.fc{display:grid;gap:6px}
.fc div{display:grid;grid-template-columns:84px 1fr 36px;gap:10px;align-items:center;font-size:.9rem}
.fc .track{height:14px;background:var(--sunk);border-radius:4px;overflow:hidden}
.fc .track span{display:block;height:100%;background:var(--accent);border-radius:4px}
.fc b{font-family:var(--f-mono);font-size:.82rem;text-align:right;font-variant-numeric:tabular-nums}
/* escucha y pronunciación */
.btn svg{width:16px;height:16px;fill:currentColor;flex:none}
.wd{display:flex;flex-wrap:wrap;gap:4px 6px;font-family:var(--f-mono);font-size:.85rem}
.wd span{padding:1px 6px;border-radius:5px}
.wd .hit{background:var(--ok-soft);color:var(--ok)}
.wd .miss{background:var(--bad-soft);color:var(--bad);text-decoration:underline wavy;text-underline-offset:3px}
.pr-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.pr-item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;min-width:0}
.heard{font-size:.9rem;color:var(--muted);overflow-wrap:anywhere}
.transcript{display:grid;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.inrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;width:100%}
.inrow input.fill{flex:1;min-width:0}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><span class="logo">EN</span>Ruta Inglés Dev</div>
    <nav class="tabs" id="tabs">
      <button data-act="go" data-v="home">Inicio</button>
      <button data-act="go" data-v="route">Ruta A1–C2</button>
      <button data-act="go" data-v="review">Repaso<span class="badge" id="rv-badge" hidden></span></button>
      <button data-act="go" data-v="talk">Conversar</button>
      <button data-act="go" data-v="plan">Mi plan</button>
    </nav>
    <div class="status" id="status"></div>
  </div>
</header>
<main class="wrap" id="main"></main>

<script>
/* ============ CURRÍCULO ============ */
const LEVELS = [
 {code:"A1", name:"Principiante", hours:90, goal:"Presentarte, hablar de tu rutina y entender frases simples y lentas.", units:[
  {t:"Hola, ¿quién sos?", g:"Verbo to be (am / is / are), pronombres", v:"Saludos, presentaciones, países", tech:"Deletrear tu email y usuario", talk:"Presentarte a un compañero nuevo"},
  {t:"Números y datos", g:"Números 0–1000, fechas, How old…?", v:"Teléfono, dirección, cumpleaños", tech:"Leer versiones (v2.1), @, punto, guion bajo", talk:"Intercambiar datos de contacto"},
  {t:"Mi trabajo y mis cosas", g:"a / an, plurales, this / that / these / those", v:"Profesiones, objetos de oficina", tech:"Partes de la computadora", talk:"¿A qué te dedicás?"},

"A1-1": {
 intro:"En inglés, el verbo to be significa \"ser\" y \"estar\" al mismo tiempo. Es el verbo más importante para empezar: lo usás para decir tu nombre, de dónde sos, a qué te dedicás y cómo estás.\n\nTiene solo tres formas en presente: am, is y are. En una conversación casi siempre se usan contracciones: I'm, you're, he's, she's, it's, we're, they're.\n\nOjo con un error típico de los hispanohablantes: en inglés siempre hay que poner el sujeto. \"Es developer\" se dice \"He is a developer\", nunca \"Is developer\". Y con las profesiones va el artículo a / an: \"I'm an engineer\".",
 grammar:[
  {rule:"Pronombres: I = yo · you = vos / ustedes · he = él · she = ella · it = eso (cosas, animales) · we = nosotros · they = ellos / ellas. En inglés el sujeto nunca se omite.", examples:[{en:"It is a laptop.",es:"Es una laptop."},{en:"They are developers.",es:"Ellos son desarrolladores."}]},
  {rule:"Afirmativo: I am · you are · he / she / it is · we are · they are.", examples:[{en:"I'm a student.",es:"Soy estudiante."},{en:"She is a developer.",es:"Ella es desarrolladora."},{en:"We are from Argentina.",es:"Somos de Argentina."}]},
  {rule:"a / an con profesiones: a antes de sonido de consonante (a student, a developer) y an antes de sonido de vocal (an engineer, an analyst). En plural no va: They are engineers.", examples:[{en:"I'm a developer.",es:"Soy desarrollador."},{en:"He's an engineer.",es:"Él es ingeniero."}]},
  {rule:"Nombre y origen: My name is… / I'm… · I'm from + país. Para la nacionalidad: I'm + nacionalidad (sin a/an y con mayúscula).", examples:[{en:"My name is Carlos. I'm from Argentina.",es:"Me llamo Carlos. Soy de Argentina."},{en:"I'm Argentinian.",es:"Soy argentino."}]},
  {rule:"Negativo: agregá not después del verbo. Contracciones: I'm not · isn't · aren't.", examples:[{en:"I'm not tired.",es:"No estoy cansado."},{en:"It isn't difficult.",es:"No es difícil."}]},
  {rule:"Pregunta: el verbo va antes del sujeto. Respuesta corta: Yes, I am. / No, I'm not.", examples:[{en:"Are you an engineer?",es:"¿Sos ingeniero?"},{en:"Is she from Chile?",es:"¿Ella es de Chile?"}]}

"A1-2": {
 intro:"Los números aparecen en todas partes: teléfonos, fechas, edades, precios y, en tecnología, versiones y direcciones.\n\nDel 13 al 19 terminan en -teen (thirteen, fourteen…) y las decenas terminan en -ty (thirty, forty…). Pronunciá bien la diferencia: fourTEEN (14) se acentúa al final y FORty (40) al principio.\n\nPara la edad se usa to be, no to have: \"I'm 25 years old\", nunca \"I have 25 years\". Los teléfonos se dicen dígito por dígito, y el 0 muchas veces se dice \"oh\". En las fechas se usan números ordinales: first, second, third, fourth…: \"My birthday is on May 3rd\". En software, \"v2.1\" se lee \"version two point one\".",
 grammar:[
  {rule:"Del 0 al 12: zero (oh), one, two, three, four, five, six, seven, eight, nine, ten, eleven, twelve. Tocá el audio de cada ejemplo para escuchar la pronunciación.",examples:[{en:"zero, one, two, three, four, five, six",es:"0, 1, 2, 3, 4, 5, 6"},{en:"seven, eight, nine, ten, eleven, twelve",es:"7, 8, 9, 10, 11, 12"}]},
  {rule:"Del 13 al 19 con -teen: thirteen, fourteen, fifteen, sixteen, seventeen, eighteen, nineteen. Ojo con las irregulares: thirteen (no threeteen) y fifteen (no fiveteen).",examples:[{en:"thirteen, fourteen, fifteen, sixteen",es:"13, 14, 15, 16"},{en:"seventeen, eighteen, nineteen",es:"17, 18, 19"}]},
  {rule:"Decenas con -ty: twenty, thirty, forty, fifty, sixty, seventy, eighty, ninety. Para el resto, decena + guion + unidad: twenty-one, forty-five. 100 = one hundred. 250 = two hundred and fifty en inglés británico y two hundred fifty en americano; las dos formas son correctas.",examples:[{en:"twenty, thirty, forty, fifty",es:"20, 30, 40, 50"},{en:"twenty-three, ninety-nine, one hundred",es:"23, 99, 100"}]},
  {rule:"Meses (siempre con mayúscula): January, February, March, April, May, June, July, August, September, October, November, December.",examples:[{en:"January, February, March, April, May, June",es:"enero a junio"},{en:"July, August, September, October, November, December",es:"julio a diciembre"}]},
  {rule:"Edad con to be: How old are you? → I'm + número (+ years old).",examples:[{en:"How old are you? I'm 22.",es:"¿Cuántos años tenés? Tengo 22."},{en:"She's thirty years old.",es:"Ella tiene treinta años."}]},
  {rule:"Fechas con ordinales: on + mes + ordinal. 1st, 2nd, 3rd, y después -th.",examples:[{en:"The meeting is on March 1st.",es:"La reunión es el 1 de marzo."},{en:"My birthday is on October 18th.",es:"Mi cumpleaños es el 18 de octubre."}]},

"A1-3": {
 intro:"En esta unidad vas a hablar de tu trabajo y de las cosas que usás todos los días: tu laptop, tu escritorio, tus auriculares.\n\nPrimero, a y an. Las dos significan \"un / una\", y se elige por el sonido, no por la letra: \"a laptop\", \"an engineer\", pero \"a user\" (user suena \"iúser\") y \"an IT manager\" (IT suena \"ai-tí\").\n\nSegundo, los plurales. Casi siempre se agrega -s: \"laptops\", \"keys\". Hay algunas reglas de ortografía y unos pocos plurales irregulares muy comunes, como \"people\" y \"women\".\n\nTercero, this, that, these y those, para señalar cosas. This (este / esta) y these (estos / estas) son para lo que está cerca; that (ese / aquel) y those (esos / aquellos), para lo que está lejos. A diferencia de los adjetivos, que en inglés no cambian en plural, el demostrativo sí cambia: \"this laptop\" → \"these laptops\".",
 grammar:[
  {rule:"a / an según el sonido: a + sonido de consonante (a desk, a user, a UX designer) · an + sonido de vocal (an engineer, an analyst, an IT manager). Solo va con una cosa o persona; en plural no se usa.",examples:[{en:"She's a UX designer.",es:"Ella es diseñadora UX."},{en:"He's an IT manager.",es:"Él es gerente de IT."},{en:"They are analysts.",es:"Ellos son analistas."}]},
  {rule:"Plural regular: + s (laptop → laptops). Después de s, sh, ch o x: + es (box → boxes, switch → switches). Consonante + y: -y → -ies (company → companies). Vocal + y: solo + s (key → keys).",examples:[{en:"These are my keys.",es:"Estas son mis llaves."},{en:"Google and Microsoft are companies.",es:"Google y Microsoft son empresas."}]},
  {rule:"Plurales irregulares frecuentes: man → men · woman → women · person → people · child → children. People ya es plural, así que va con are.",examples:[{en:"They are nice people.",es:"Son buenas personas."},{en:"The two women are engineers.",es:"Las dos mujeres son ingenieras."}]},
  {rule:"this / that (singular) · these / those (plural). This y these: cerca. That y those: lejos. Se usan con un sustantivo (this laptop) o solos (This is my laptop).",examples:[{en:"This is my desk.",es:"Este es mi escritorio."},{en:"That is the meeting room.",es:"Esa es la sala de reuniones."},{en:"These cables are new. Those cables are old.",es:"Estos cables son nuevos. Esos cables son viejos."}]},
  {rule:"Preguntar qué es algo: What's this / that? → It's a… · What are these / those? → They're…",examples:[{en:"What's this? It's a charger.",es:"¿Qué es esto? Es un cargador."},{en:"What are those? They're headphones.",es:"¿Qué son esos? Son auriculares."}]}
 ],

"A1-4": {
 intro:"El presente simple sirve para hablar de rutinas, hábitos y cosas que son siempre así: \"I work from home\", \"She starts at nine\".\n\nLa forma es muy fácil: el verbo queda igual con I, you, we y they. La única diferencia está en la tercera persona (he, she, it), donde el verbo lleva -s: \"I work\", pero \"she works\". Es el error más común en los primeros niveles, así que prestale atención.\n\nTambién vas a aprender a decir la hora (\"It's half past seven\") y a usar at con la hora y on con los días: \"at nine o'clock\", \"on Monday\". Con eso ya podés contar un día típico de trabajo.",
 grammar:[
  {rule:"I / you / we / they + verbo sin cambios. He / she / it + verbo + s.",examples:[{en:"I work from home.",es:"Trabajo desde casa."},{en:"She works at the office.",es:"Ella trabaja en la oficina."},{en:"Ana writes code every day.",es:"Ana escribe código todos los días."}]},
  {rule:"Ortografía de la -s: después de s, sh, ch, x u o se agrega -es (watches, finishes, goes, does). Consonante + y → -ies (study → studies). Vocal + y → solo + s (play → plays). Irregular: have → has.",examples:[{en:"He finishes work at six.",es:"Él termina de trabajar a las seis."},{en:"She studies English.",es:"Ella estudia inglés."},{en:"Diego has breakfast at eight.",es:"Diego desayuna a las ocho."}]},
  {rule:"La hora: What time is it? → It's nine o'clock (en punto) · half past nine (y media) · quarter past nine (y cuarto) · quarter to ten (menos cuarto). También podés decir los números: It's nine thirty.",examples:[{en:"It's seven o'clock.",es:"Son las siete en punto."},{en:"It's half past eight.",es:"Son las ocho y media."},{en:"It's quarter to ten.",es:"Son las diez menos cuarto."}]},
  {rule:"at + hora · on + día. Los días llevan mayúscula: Monday, Tuesday, Wednesday, Thursday, Friday, Saturday, Sunday. On Mondays (en plural) = todos los lunes. Con partes del día: in the morning, in the afternoon, in the evening.",examples:[{en:"I start work at nine.",es:"Empiezo a trabajar a las nueve."},{en:"She works from home on Fridays.",es:"Ella trabaja desde casa los viernes."},{en:"I review code in the afternoon.",es:"Reviso código a la tarde."}]},
  {rule:"Orden de la oración: sujeto + verbo + resto. La hora o el día suelen ir al final.",examples:[{en:"I check my emails at nine.",es:"Reviso mis emails a las nueve."},{en:"We have a meeting on Monday.",es:"Tenemos una reunión el lunes."}]}
 ],

  {en:"get up",es:"levantarse",example:"I get up at seven."},

 model:{title:"Un día de semana contado con la hora y la rutina de una colega. Usá la misma estructura con tu día.",en:"I'm a developer. I get up at seven o'clock and I have breakfast. I start work at nine. The daily starts at nine thirty. I write code in the morning and I review code in the afternoon. My colleague Ana works from the office on Mondays. She finishes work at five. I finish work at six and I go to bed at eleven.",es:"Soy desarrollador. Me levanto a las siete y desayuno. Empiezo a trabajar a las nueve. La daily empieza a las nueve y media. Escribo código a la mañana y reviso código a la tarde. Mi compañera Ana trabaja en la oficina los lunes. Ella termina de trabajar a las cinco. Yo termino a las seis y me voy a dormir a las once."},

"A1-5": {
 intro:"Para preguntar y negar en presente simple, el inglés usa un verbo auxiliar: do (o does con he, she, it). En español no existe nada parecido, así que al principio cuesta.\n\nPara negar: \"I don't use Windows\", \"She doesn't work on Sundays\". Para preguntar: \"Do you use Git?\", \"Does it work?\". Ojo: cuando aparece does o doesn't, el verbo principal pierde la -s: \"She works\", pero \"She doesn't work\" y \"Does she work?\".\n\nCon to be no se usa do: \"Are you a developer?\", \"I'm not tired\". También vas a aprender las palabras de pregunta (what, where, when, how often) y los adverbios de frecuencia (always, usually, sometimes, never) para hablar de gustos y hábitos.",
 grammar:[
  {rule:"Negativo: I / you / we / they + don't + verbo · he / she / it + doesn't + verbo. El verbo va sin -s. Don't = do not; doesn't = does not.",examples:[{en:"I don't like long meetings.",es:"No me gustan las reuniones largas."},{en:"She doesn't work on Sundays.",es:"Ella no trabaja los domingos."},{en:"It doesn't work.",es:"No funciona."}]},
  {rule:"Pregunta: Do / Does + sujeto + verbo. Respuesta corta: Yes, I do. / No, I don't. · Yes, it does. / No, it doesn't.",examples:[{en:"Do you use Git? Yes, I do.",es:"¿Usás Git? Sí."},{en:"Does the app work? No, it doesn't.",es:"¿La app funciona? No."}]},
  {rule:"Palabra de pregunta + do / does + sujeto + verbo: What, Where, When, What time, How often.",examples:[{en:"Where do you work?",es:"¿Dónde trabajás?"},{en:"What time does the daily start?",es:"¿A qué hora empieza la daily?"},{en:"How often do you test your code?",es:"¿Cada cuánto probás tu código?"}]},
  {rule:"Frecuencia: always (siempre) · usually (normalmente) · sometimes (a veces) · never (nunca). Van antes del verbo principal, pero después de to be. Never ya es negativo: no se usa con don't.",examples:[{en:"I always test my code.",es:"Siempre pruebo mi código."},{en:"He never works on Sundays.",es:"Él nunca trabaja los domingos."},{en:"I'm never late.",es:"Nunca llego tarde."}]},
  {rule:"Gustos: like + cosa. I like… / I don't like… / Do you like…?",examples:[{en:"I like Python.",es:"Me gusta Python."},{en:"Do you like coffee? No, I don't.",es:"¿Te gusta el café? No."}]}
 ],

"A1-6": {
 intro:"En esta unidad vas a aprender dos verbos muy útiles: have (tener) y can (poder o saber hacer algo).\n\nHave funciona como cualquier verbo en presente simple: \"I have a laptop\", pero con he, she, it cambia a has: \"She has two brothers\". Para negar y preguntar usás do / does, como en la unidad anterior: \"I don't have a car\", \"Do you have a GitHub account?\". En inglés británico también vas a escuchar have got (\"I've got a laptop\"), que significa lo mismo.\n\nCan es distinto: nunca lleva -s, no usa do y el verbo que sigue va sin to: \"She can code in Python\", \"Can you speak English?\", \"I can't drive\". Es la forma natural de hablar de tus habilidades en una entrevista. Al pronunciar, can suele sonar débil y corto, y can't, fuerte y con la t final. Esa diferencia te ayuda a entender si alguien dice que sí o que no.",
 grammar:[
  {rule:"have / has: I, you, we, they have · he, she, it has.",examples:[{en:"I have a new laptop.",es:"Tengo una laptop nueva."},{en:"She has two brothers.",es:"Ella tiene dos hermanos."}]},
  {rule:"Negativo y pregunta con do / does: I don't have… · She doesn't have… · Do you have…? Yes, I do. Después de does o doesn't va have, nunca has.",examples:[{en:"I don't have a car.",es:"No tengo auto."},{en:"Does he have a GitHub account? Yes, he does.",es:"¿Él tiene cuenta de GitHub? Sí."}]},
  {rule:"can / can't + verbo: es igual para todas las personas, sin -s y sin to. Can't = cannot.",examples:[{en:"I can code in Python.",es:"Sé programar en Python."},{en:"He can't drive.",es:"Él no sabe manejar."},{en:"We can speak Spanish and English.",es:"Hablamos español e inglés."}]},
  {rule:"Pregunta con can: Can + sujeto + verbo? Respuesta corta: Yes, I can. / No, I can't. Con can no se usa do.",examples:[{en:"Can you speak English? Yes, I can.",es:"¿Hablás inglés? Sí."},{en:"Can she design websites? No, she can't.",es:"¿Ella sabe diseñar sitios web? No."}]},
  {rule:"Para matizar una habilidad: a little (un poco) · well (bien) · very well (muy bien). Van al final.",examples:[{en:"I can speak English a little.",es:"Hablo un poco de inglés."},{en:"She can cook very well.",es:"Ella cocina muy bien."}]}
 ],

"A1-7": {
 intro:"El presente continuo sirve para hablar de lo que está pasando ahora mismo: \"I'm fixing a bug\", \"It's raining\". Se forma con el verbo to be (am / is / are) y el verbo con -ing.\n\nEs muy común en videollamadas y chats de trabajo: \"I'm in a meeting\", \"I'm sharing my screen\", \"The server isn't working\".\n\nNo lo confundas con el presente simple de la unidad 4. El presente simple es para rutinas (\"I work from home every day\"); el continuo, para este momento (\"I'm working now\"). Algunos verbos casi nunca van en -ing aunque hablen del presente, como like: se dice \"I like this song\", no \"I'm liking this song\".",
 grammar:[
  {rule:"Forma: am / is / are + verbo con -ing. En la conversación se contrae: I'm working, she's coding, they're testing.",examples:[{en:"I'm fixing a bug.",es:"Estoy arreglando un bug."},{en:"She's writing an email.",es:"Ella está escribiendo un email."},{en:"We're testing the app.",es:"Estamos probando la app."}]},
  {rule:"Ortografía del -ing: casi siempre + ing (work → working). Si termina en -e muda, se quita la e (write → writing, share → sharing). Si es corto y termina en una vocal + una consonante, la consonante se duplica (run → running, stop → stopping, sit → sitting).",examples:[{en:"I'm sharing my screen.",es:"Estoy compartiendo mi pantalla."},{en:"The tests are running.",es:"Los tests se están ejecutando."}]},
  {rule:"Negativo: am not / isn't / aren't + -ing. Pregunta: Am / Is / Are + sujeto + -ing? Respuesta corta: Yes, I am. / No, it isn't.",examples:[{en:"The server isn't working.",es:"El servidor no está funcionando."},{en:"Are you working now? Yes, I am.",es:"¿Estás trabajando ahora? Sí."},{en:"What are you doing?",es:"¿Qué estás haciendo?"}]},
  {rule:"Presente simple (rutinas: every day, usually) frente a presente continuo (ahora: now, right now, today).",examples:[{en:"I usually work at the office, but today I'm working from home.",es:"Normalmente trabajo en la oficina, pero hoy estoy trabajando desde casa."},{en:"He writes code every day. Now he's having lunch.",es:"Él escribe código todos los días. Ahora está almorzando."}]},
  {rule:"Clima y ropa: It's raining / It's snowing · It's sunny / cold / hot · I'm wearing + ropa.",examples:[{en:"It's raining and it's cold.",es:"Está lloviendo y hace frío."},{en:"I'm wearing a T-shirt and jeans.",es:"Tengo puesta una remera y un jean."}]}
 ],

"A1-8": {
 intro:"Para decir que algo existe o está en un lugar, el inglés usa there is (singular) y there are (plural). Equivale al \"hay\" del español: \"There is a café near here\", \"There are two meeting rooms\".\n\nPara decir dónde está algo, usás preposiciones de lugar: in, on, under, next to, between, behind, in front of y near. Las más usadas son in (dentro de), on (sobre, apoyado en) y at (en un punto o lugar: at the office, at home).\n\nEn tecnología se usan igual: \"The file is in the folder\", \"The website is on the server\", \"The button is at the top of the page\". Y para dar indicaciones en una ciudad, el verbo va solo al principio, sin sujeto: \"Go straight\", \"Turn left\".",
 grammar:[
  {rule:"there is + singular · there are + plural. Contracción: there's. Negativo: there isn't / there aren't.",examples:[{en:"There is a bug in the code.",es:"Hay un bug en el código."},{en:"There are two meeting rooms.",es:"Hay dos salas de reuniones."},{en:"There isn't a printer here.",es:"Acá no hay impresora."}]},
  {rule:"Pregunta: Is there…? / Are there any…? Respuesta corta: Yes, there is. / No, there aren't. Any se usa en preguntas y negaciones con plural.",examples:[{en:"Is there a café near here? Yes, there is.",es:"¿Hay un café cerca? Sí."},{en:"Are there any tests? No, there aren't.",es:"¿Hay tests? No."}]},
  {rule:"Preposiciones de lugar: in (dentro de) · on (sobre) · under (debajo de) · next to (al lado de) · between (entre) · behind (detrás de) · in front of (delante de) · near (cerca de).",examples:[{en:"My laptop is on the desk.",es:"Mi laptop está sobre el escritorio."},{en:"The bank is between the café and the hotel.",es:"El banco está entre el café y el hotel."},{en:"The keyboard is in front of the monitor.",es:"El teclado está delante del monitor."}]},
  {rule:"at para un punto o lugar: at home, at the office, at the top / bottom of the page. in para archivos y carpetas: in the folder, in the file. on para servidores, sitios y páginas: on the server, on the website, on this page.",examples:[{en:"I'm at the office.",es:"Estoy en la oficina."},{en:"The file is in the src folder.",es:"El archivo está en la carpeta src."},{en:"The website is on the server.",es:"El sitio está en el servidor."}]},
  {rule:"Indicaciones: el verbo va al principio y sin sujeto. Go straight · Turn left / right · It's on the left / right.",examples:[{en:"Go straight and turn left.",es:"Seguí derecho y doblá a la izquierda."},{en:"The bank is on the right.",es:"El banco está a la derecha."}]}
 ],

const ONES=["zero","one","two","three","four","five","six","seven","eight","nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
const TENS=["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];
function numWords(n){
  if(n<20) return ONES[n];
  if(n<100) return TENS[Math.floor(n/10)]+(n%10?" "+ONES[n%10]:"");
  if(n<1000) return ONES[Math.floor(n/100)]+" hundred"+(n%100?" "+numWords(n%100):"");
  if(n<1000000) return numWords(Math.floor(n/1000))+" thousand"+(n%1000?" "+numWords(n%1000):"");
  return String(n).split("").map(d=>ONES[+d]).join(" ");
}
function ordWords(n){
  const w=numWords(n).split(" "), last=w.pop();
  const irr={one:"first",two:"second",three:"third",five:"fifth",eight:"eighth",nine:"ninth",twelve:"twelfth"};
  w.push(irr[last]||(last.endsWith("y")?last.slice(0,-1)+"ieth":last+"th")); return w.join(" ");
}
// Lleva un texto a palabras comparables: sin mayúsculas, tildes ni puntuación, con números en letras y contracciones expandidas.
function spokenWords(s){
  let t=" "+String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[’‘`´]/g,"'")+" ";
  t=t.replace(/(\d+)\.(\d+)/g,(m,a,b)=>numWords(+a)+" point "+b.split("").map(d=>ONES[+d]).join(" "));
  t=t.replace(/(\d+)(st|nd|rd|th)\b/g,(m,a)=>ordWords(+a));
  t=t.replace(/(\d+):(\d\d)/g,(m,a,b)=>numWords(+a)+" "+(+b?numWords(+b):"o'clock"));
  t=t.replace(/\d+/g,m=>m.length>6?m.split("").map(d=>ONES[+d]).join(" "):numWords(+m));
  t=t.replace(/\bi'm\b/g,"i am").replace(/\bcan't\b|\bcannot\b/g,"can not").replace(/\bwon't\b/g,"will not")
     .replace(/\b(\w+)n't\b/g,"$1 not").replace(/\b(\w+)'re\b/g,"$1 are").replace(/\b(\w+)'ve\b/g,"$1 have")
     .replace(/\b(\w+)'ll\b/g,"$1 will").replace(/\b(\w+)'s\b/g,"$1 is").replace(/\bokay\b/g,"ok");
  return t.replace(/[-_\/]/g," ").replace(/[^a-z0-9' ]+/g," ").replace(/'/g,"").split(/\s+/).filter(Boolean);
}
// Compara palabra por palabra (subsecuencia común más larga).
function wordDiff(target,said){
  const a=spokenWords(target), b=spokenWords(said);
  const dp=[...Array(a.length+1)].map(()=>new Array(b.length+1).fill(0));
  for(let i=a.length-1;i>=0;i--) for(let j=b.length-1;j>=0;j--) dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const ok=new Array(a.length).fill(false); let i=0,j=0;
  while(i<a.length&&j<b.length){ if(a[i]===b[j]){ok[i]=true;i++;j++;} else if(dp[i+1][j]>=dp[i][j+1]) i++; else j++; }
  return {words:a,ok,pct:a.length?Math.round(dp[0][0]/Math.max(a.length,b.length)*100):0};
}

function prRecord(i,text){

function prListen(i){
  const st=LST; if(!st) return; const pr=pronOf(st); if(!pr) return;
  if(!SR){ setPrMode("dict"); render(); return; }
  if(REC){ try{ REC.abort(); }catch(e){} REC=null; }
  try{ speechSynthesis.cancel(); }catch(e){}
  const target=pr.sentences[i], r=new SR();
  r.lang="en-US"; r.interimResults=false; r.maxAlternatives=4; r.continuous=false;
  r.onresult=e=>{ const alts=[...e.results[0]].map(a=>a.transcript); let best=alts[0]||"", bp=-1;
    alts.forEach(t=>{ const p=wordDiff(target,t).pct; if(p>bp){ bp=p; best=t; } }); prRecord(i,best); };
  r.onerror=e=>{
    if(["not-allowed","service-not-allowed","audio-capture"].includes(e.error)){ setPrMode("dict"); st.pr.err="El navegador no dejó usar el micrófono dentro del curso. Usá el dictado del sistema, como se explica arriba."; }

    else if(e.error!=="aborted") st.pr.err="El reconocimiento de voz falló ("+e.error+"). Probá de nuevo o usá el dictado del sistema.";
  };

  render();
}

function isRight(x,a){
  if(x.type==="mc") return a===x.answer;
  const opts=[x.answer,...(x.alt||[])].map(norm);
  return a!=null && opts.includes(norm(a));
}
function aiErr(e){

  if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(c)){aiState="off";renderStatus();return "El tutor IA no está habilitado en esta vista. Si rechazaste el permiso, recargá la página y aceptalo.";}
  if(c==="rate_limited") return "Hiciste muchas consultas seguidas o llegaste a tu límite de uso. Esperá un rato y probá de nuevo.";
  if(c==="invalid_json") return "La respuesta del tutor llegó incompleta. Tocá el botón otra vez.";
  if(c==="session_expired") return "Tu sesión expiró. Volvé a iniciar sesión en Claude.";

const passed=code=>!!(P.levels[code]&&P.levels[code].passed);
const levelUnlocked=li=>li===0||passed(LEVELS[li-1].code);
const unitDone=id=>!!(P.units[id]&&P.units[id].done);
function unitUnlocked(u){
  const li=levelIdx(u.level); if(!levelUnlocked(li)) return false;
  if(u.n===1||passed(u.level)) return true;
  return unitDone(u.level+"-"+(u.n-1));
}
function currentLevel(){ const i=LEVELS.findIndex(L=>!passed(L.code)); return i<0?LEVELS.length-1:i; }
function nextUnit(){ const L=LEVELS[currentLevel()]; return L.units.find(u=>!unitDone(u.id))||null; }
function touchStreak(){
  const t=todayStr(), s=P.streak;
  if(s.last===t) return;
  const y=new Date(); y.setDate(y.getDate()-1);
  const ys=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
  s.count = s.last===ys ? s.count+1 : 1; s.last=t;
}
function log(type,ref,score,label){
  touchStreak();
  P.history.unshift({type,ref,score:Math.round(score),label,at:new Date().toISOString()});
  if(P.history.length>150) P.history.length=150;
}
function addErrors(list){
  (list||[]).filter(e=>e.seen!==false).forEach(e=>{ const c=CATS.includes(e.category)?e.category:"vocabulario"; P.errors[c]=(P.errors[c]||0)+1; });
}
function setUnitScore(id,key,val){
  const u=P.units[id]||(P.units[id]={});
  u[key]=Math.max(u[key]||0,Math.round(val)); u.at=new Date().toISOString();
  if(!u.done&&(u.quiz||0)>=QUIZ_PASS&&(u.writing||0)>=WRITE_PASS){ u.done=true; log("unit",id,((u.quiz+u.writing)/2),"Unidad completada"); return true; }
  return false;
}
function avgScore(){ const v=Object.values(P.units).flatMap(u=>[u.quiz,u.writing].filter(x=>x!=null)); return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null; }

let SRS={};                 // clave → tarjeta
const srsDirty=new Set();   // niveles con cambios sin guardar (un documento por nivel)
const addDays=n=>{const d=new Date(); d.setDate(d.getDate()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const lvlOf=ref=>(String(ref).match(/^(A1|A2|B1|B2|C1|C2)/)||[])[1]||"A1";
const srsExKey=(ref,x)=>"x|"+ref+"|"+norm(x.q).slice(0,90);
function srsPut(card){
  const old=SRS[card.k], t=todayStr();
  if(old){
    if(card.t==="v") return 0;                       // el vocabulario ya está en repaso
    Object.assign(old,card,{bx:0,d:t,l:(old.l||0)+1}); // error repetido: vuelve a empezar
    srsDirty.add(lvlOf(old.u)); return 1;
  }
  SRS[card.k]=Object.assign({bx:0,d:t,n:0,l:0,a:t},card); srsDirty.add(lvlOf(card.u)); return 1;
}
function srsPutEx(ref,x){
  const c={type:x.type,q:x.q,why:x.why||""};
  if(x.type==="mc"){ c.options=x.options; c.answer=x.answer; } else { c.answer=x.answer; c.alt=x.alt||[]; }
  return srsPut({k:srsExKey(ref,x),t:"x",u:ref,x:c});
}
function srsAddLesson(id,l,ans){
  let n=0;
  (l.vocab||[]).forEach(v=>{ if(v&&v.en&&v.es) n+=srsPut({k:"v|"+id+"|"+norm(v.en).slice(0,90),t:"v",u:id,f:String(v.es),b:String(v.en),w:String(v.example||"")}); });
  (l.exercises||[]).forEach((x,i)=>{ if(!reported(`ex|${id}|${i}`)&&!isRight(x,ans[i])) n+=srsPutEx(id,x); });
  return n;
}
function srsAddErrors(ref,errs){
  let n=0;
  (errs||[]).filter(e=>e&&e.original&&e.fix&&e.seen!==false).forEach(e=>{ n+=srsPut({k:"f|"+norm(e.original).slice(0,90),t:"f",u:ref,f:String(e.original),b:String(e.fix),w:String(e.why||""),c:String(e.category||"")}); });
  return n;
}
function srsDrop(k){ const c=SRS[k]; if(!c) return; delete SRS[k]; srsDirty.add(lvlOf(c.u)); srsSave(); }
let srsChain=Promise.resolve();
function srsSave(){
  lsSet(SRS_LS,SRS);
  if(!DB||!UID||!srsDirty.size) return;
  const lv=[...srsDirty]; srsDirty.clear();
  srsChain=srsChain.then(async()=>{ for(const L of lv){
    try{ await DB.doc(`data/users/${UID}/srs-${L}`).set({cards:clone(Object.values(SRS).filter(c=>lvlOf(c.u)===L))}); }
    catch(e){ srsDirty.add(L); }
  }});
}
async function srsLoad(){
  if(!DB||!UID) return;
  for(const L of SRS_LEVELS){
    try{
      const s=await DB.doc(`data/users/${UID}/srs-${L}`).get();
      if(s.exists&&Array.isArray(s.data().cards)){
        Object.keys(SRS).forEach(k=>{ if(lvlOf(SRS[k].u)===L) delete SRS[k]; });
        clone(s.data().cards).forEach(c=>{ if(c&&c.k) SRS[c.k]=c; });
      } else if(Object.values(SRS).some(c=>lvlOf(c.u)===L)) srsDirty.add(L);
    }catch(e){}
  }
  srsSave();
}
// Unidades hechas antes de que existiera el repaso: suma su vocabulario.
async function srsBackfill(){
  const ids=Object.keys(P.units).filter(id=>unitById(id)&&P.units[id].quiz!=null&&!Object.values(SRS).some(c=>c.t==="v"&&c.u===id));
  for(const id of ids){ const l=await getStoredLesson(id); if(l) srsAddLesson(id,{vocab:l.vocab,exercises:[]},{}); }
  if(ids.length){ srsSave(); renderStatus(); if(view.name==="review"||view.name==="home") render(); }
}
const srsDue=()=>{ const t=todayStr(); return Object.values(SRS).filter(c=>c.d<=t).sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:((a.t==="v")-(b.t==="v"))||(a.bx-b.bx)); };
function srsGrade(c,g){
  c.n=(c.n||0)+1; c.last=todayStr();
  if(g===0){ c.bx=0; c.l=(c.l||0)+1; c.d=todayStr(); }
  else if(g===1){ c.bx=Math.max(1,c.bx); c.d=addDays(SRS_INT[c.bx]); }
  else { c.bx=Math.min(SRS_INT.length-1,c.bx===0?2:c.bx+1); c.d=addDays(SRS_INT[c.bx]); }
  srsDirty.add(lvlOf(c.u));
}
const fmtDay=d=>{ try{ return new Date(d+"T12:00:00").toLocaleDateString("es-AR",{weekday:"long",day:"numeric",month:"long"}); }catch(e){ return d; } };
function unitLabel(u){ const un=unitById(u); if(un) return un.id+" · "+un.t; if(/-EX$/.test(u)) return "Examen "+lvlOf(u); return "Conversación "+u; }
function vMatch(input,b){ const clean=b.replace(/\([^)]*\)/g,""); return [clean,...clean.split(/\s*[\/·,]\s*/)].map(norm).filter(Boolean).includes(norm(input)); }

/* sesión de repaso */
let RV=null;
function rvStart(){ const q=srsDue().slice(0,SRS_SESSION).map(c=>c.k); if(!q.length) return; RV={queue:q,i:0,rev:false,ans:null,input:"",right:false,ok:0,failed:new Set(),done:false}; go("review"); }
const rvCur=()=>RV&&!RV.done?SRS[RV.queue[RV.i]]||null:null;
function rvAdvance(){
  RV.i++; RV.rev=false; RV.ans=null; RV.input=""; RV.right=false;
  while(RV.i<RV.queue.length&&!SRS[RV.queue[RV.i]]) RV.i++;
  if(RV.i>=RV.queue.length){
    RV.done=true; const u=new Set(RV.queue.filter(k=>SRS[k])).size;
    if(u){ log("review","Repaso",RV.ok/u*100,"Repaso: "+u+" tarjeta"+(u===1?"":"s")); save(); }
  }
  srsSave(); render();
}
function rvGrade(g){
  const c=rvCur(); if(!c) return;
  const again=RV.failed.has(c.k);
  if(again&&g===2) g=1;                      // la fallaste hoy: vuelve mañana aunque ahora la sepas
  srsGrade(c,g);
  if(g>0&&!again) RV.ok++;
  if(g===0&&!again){ RV.failed.add(c.k); RV.queue.push(c.k); }
  rvAdvance();
}
function rvCheck(){
  const c=rvCur(); if(!c||c.t!=="x"||RV.rev) return;
  const a=c.x.type==="mc"?RV.ans:RV.input; if(a==null||String(a).trim()==="") return;
  RV.right=isRight(c.x,a); RV.rev=true; render();
}
function rvShow(){ const c=rvCur(); if(!c||RV.rev) return; if(c.t==="x") return rvCheck(); RV.rev=true; render(); }
function rvDrop(){ const c=rvCur(); if(!c) return; srsDrop(c.k); RV.i--; rvAdvance(); }
function rvCardHTML(c){
  const tag={v:"Vocabulario",x:"Ejercicio que fallaste",f:"Error tuyo para corregir"}[c.t];
  const top=`<div class="row" style="justify-content:space-between"><span class="pill ${c.t==="v"?"acc":"warn"}">${tag}</span><span class="mono muted">${esc(unitLabel(c.u))} · ${RV.i+1}/${RV.queue.length}</span></div>`;
  const inp=ph=>`<input class="fill" id="rv-in" value="${esc(RV.input)}" placeholder="${ph}" autocomplete="off" spellcheck="false" autocapitalize="off">`;
  const back=(en,sub,subCls)=>`<div class="rv-back"><div class="row" style="flex-wrap:nowrap;align-items:flex-start">${sayBtn(en+(c.t==="v"&&sub?". "+sub:""))}<div style="min-width:0"><div class="ex-en" style="font-size:1.25rem">${esc(en)}</div>${sub?`<div class="${subCls}">${esc(sub)}</div>`:""}</div></div></div>`;
  let body="";
  if(c.t==="v"){
    body=`<div class="label">¿Cómo se dice en inglés?</div><div class="rv-front">${esc(c.f)}</div>${RV.rev?"":inp("Escribilo (opcional) y tocá Mostrar")}`;
    if(RV.rev) body+=(RV.input.trim()?`<p>Tu respuesta: <b>${esc(RV.input)}</b> ${vMatch(RV.input,c.b)?'<span class="pill ok">coincide</span>':'<span class="pill bad">compará con la respuesta</span>'}</p>`:"")+back(c.b,c.w,"ex-es");
  } else if(c.t==="f"){
    body=`<div class="label">Este error apareció en tu práctica. ¿Cómo se dice bien?</div><div class="rv-front"><s style="color:var(--bad);text-decoration-thickness:2px">${esc(c.f)}</s></div>${RV.rev?"":inp("Escribí la versión correcta (opcional)")}`;
    if(RV.rev) body+=(RV.input.trim()?`<p>Tu versión: <b>${esc(RV.input)}</b> ${norm(RV.input)===norm(c.b)?'<span class="pill ok">coincide</span>':'<span class="pill bad">compará con la corrección</span>'}</p>`:"")+back(c.b,c.w,"why");
  } else {
    const x=c.x;
    body=`<div class="rv-front" style="font-size:1.25rem">${esc(x.q)}</div>`;
    if(x.type==="mc") body+=`<div class="opts">${x.options.map((o,j)=>`<button type="button" class="opt ${RV.ans===j?"sel":""} ${RV.rev&&j===x.answer?"right":""} ${RV.rev&&RV.ans===j&&j!==x.answer?"wrong":""}" data-act="rvpick" data-o="${j}" ${RV.rev?"disabled":""}>${esc(o)}</button>`).join("")}</div>`;
    else body+=`<input class="fill" id="rv-in" value="${esc(RV.input)}" ${RV.rev?"disabled":""} placeholder="Escribí la respuesta" autocomplete="off" spellcheck="false" autocapitalize="off">${RV.rev&&!RV.right?`<div class="ans">Respuesta correcta: <b>${esc(x.answer)}</b></div>`:""}`;
    if(RV.rev) body+=`<div class="result ${RV.right?"pass":""}" style="padding:12px"><b>${RV.right?"¡Correcto!":"Todavía no. Vuelve a aparecer al final de esta sesión."}</b>${x.why?`<div class="why">${esc(x.why)}</div>`:""}</div>`;
  }
  const foot=c.t==="x"
    ? (RV.rev?`<button class="btn primary" data-act="rvnext">Siguiente <span class="kbd">Enter</span></button>`:`<button class="btn primary" data-act="rvcheck">Comprobar <span class="kbd">Enter</span></button>`)
    : (RV.rev?`<div class="grades"><button class="btn" data-act="rvgrade" data-g="0">No me acordaba <span class="kbd">1</span></button><button class="btn" data-act="rvgrade" data-g="1">Me costó <span class="kbd">2</span></button><button class="btn primary" data-act="rvgrade" data-g="2">Lo sabía <span class="kbd">3</span></button></div>`
             :`<button class="btn primary" data-act="rvshow">Mostrar respuesta <span class="kbd">Espacio</span></button>`);
  return `<section class="card rv-card" aria-live="polite">${top}${body}<div class="stack" style="gap:10px">${foot}<div class="row" style="justify-content:space-between"><button class="rep-btn" data-act="rvdrop">Quitar esta tarjeta del repaso</button><button class="rep-btn" data-act="rvquit">Terminar por hoy</button></div></div></section>`;
}
function vReview(){
  const all=Object.values(SRS), due=srsDue();
  const learned=all.filter(c=>c.bx>=SRS_LEARNED).length, errs=all.filter(c=>c.t!=="v"&&c.bx<SRS_LEARNED).length;
  const head=`<section class="stack"><div class="label">Repaso espaciado</div><h1>Repaso</h1>
    <p class="muted" style="max-width:68ch">Las palabras de cada unidad y tus errores vuelven a aparecer justo antes de que los olvides: al día siguiente, a los 3 días, a la semana, a las 2 semanas y así. Si fallás una tarjeta, vuelve al principio. Con 10 minutos por día alcanza.</p></section>`;
  const cur=rvCur();
  if(cur) return head+rvCardHTML(cur);
  const stats=`<section class="stats"><div class="stat"><span class="label">Para hoy</span><b>${due.length}</b></div><div class="stat"><span class="label">En repaso</span><b>${all.length}</b></div><div class="stat"><span class="label">Aprendidas</span><b>${learned}</b></div><div class="stat"><span class="label">Errores a fijar</span><b>${errs}</b></div></section>`;
  let main="";
  if(RV&&RV.done){ const u=new Set(RV.queue.filter(k=>SRS[k])).size;
    main=`<section class="result pass"><div class="row"><span class="score">${u?Math.round(RV.ok/u*100):0}%</span><span>Repasaste ${u} tarjeta${u===1?"":"s"} y acertaste ${RV.ok} al primer intento. Las que sabías vuelven más adelante; las que fallaste, mañana.</span></div>
      <div class="row">${due.length?`<button class="btn primary" data-act="rvstart">Seguir repasando (${due.length})</button>`:""}<button class="btn" data-act="go" data-v="home">Volver al inicio</button></div></section>`; }
  if(!all.length) main+=`<div class="note"><b>Todavía no tenés tarjetas.</b> Se crean solas: cuando comprobás los ejercicios de una unidad se agrega su vocabulario y cada ejercicio que fallaste, y cuando el tutor corrige una escritura, un examen o una conversación se agregan tus errores.</div>`;
  else if(due.length&&!(RV&&RV.done)) main+=`<section class="card row" style="justify-content:space-between"><div><h3>Tenés ${due.length} tarjeta${due.length===1?"":"s"} para hoy</h3><p class="muted">Sesiones de hasta ${SRS_SESSION} tarjetas. Primero van tus errores y después el vocabulario.</p></div><button class="btn primary" data-act="rvstart">Empezar repaso</button></section>`;
  else if(!due.length) main+=`<section class="card stack"><h3>¡Estás al día!</h3><p class="muted">No tenés tarjetas pendientes. La próxima vuelve el ${esc(fmtDay(all.map(c=>c.d).sort()[0]))}.</p></section>`;
  let fc="";
  if(all.length){
    const days=[...Array(7)].map((_,i)=>{ const d=addDays(i); return {i,d,n:all.filter(c=>i===0?c.d<=d:c.d===d).length}; });
    const mx=Math.max(1,...days.map(x=>x.n));
    const name=x=>x.i===0?"Hoy":x.i===1?"Mañana":new Date(x.d+"T12:00:00").toLocaleDateString("es-AR",{weekday:"short",day:"numeric"});
    fc=`<section class="card stack"><h3>Próximos 7 días</h3><div class="fc">${days.map(x=>`<div><span>${esc(name(x))}</span><span class="track"><span style="width:${x.n/mx*100}%"></span></span><b>${x.n}</b></div>`).join("")}</div>
      <p class="muted" style="font-size:.9rem">Una tarjeta cuenta como aprendida cuando la acertaste ${SRS_LEARNED} veces seguidas, con intervalos cada vez más largos.</p></section>`;
  }
  return head+stats+main+fc;
}

/* ============ RENDER ============ */
function renderStatus(){
  const bd=$("#rv-badge"); if(bd){ const n=srsDue().length; bd.textContent=n>99?"99+":String(n); bd.hidden=!n; }
  const ai = aiState==="on"?'<span class="pill ok"><i></i>Tutor IA activo</span>':aiState==="wait"?'<span class="pill"><i></i>Conectando tutor…</span>':'<span class="pill warn"><i></i>Tutor IA no disponible</span>';
  const sy = syncState==="ok"?'<span class="pill acc"><i></i>Guardado en tu cuenta</span>':syncState==="err"?'<span class="pill bad"><i></i>Error al guardar</span>':'<span class="pill"><i></i>Guardado en este navegador</span>';
  $("#status").innerHTML=ai+sy;
}
function render(){
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-current", (b.dataset.v===view.name||(view.name==="lesson"||view.name==="exam")&&b.dataset.v==="route")?"page":"false"));
  const fn={home:vHome,route:vRoute,lesson:vLesson,exam:vExam,talk:vTalk,plan:vPlan,review:vReview}[view.name]||vHome;
  $("#main").innerHTML=fn();
  renderStatus();
  if(view.name==="review"){ const i=$("#rv-in"); if(i&&!i.disabled&&matchMedia("(pointer:fine)").matches) i.focus(); }
  if(view.name==="talk"){ const c=$("#chat"); if(c) c.scrollTop=c.scrollHeight; }
}
function go(v,extra){ if(REC){ try{ REC.abort(); }catch(e){} REC=null; } try{ speechSynthesis.cancel(); }catch(e){} view=Object.assign({name:v},extra||{}); render(); window.scrollTo({top:0}); }

function ladderHTML(){
  const ci=currentLevel();
  return `<div class="ladder" aria-label="Niveles MCER">${LEVELS.map((L,i)=>`<div class="${passed(L.code)?"passed":i===ci?"now":""}" title="${L.name}">${L.code}</div>`).join("")}</div>`;
}

function vHome(){
  const li=currentLevel(), L=LEVELS[li], nu=nextUnit();
  const done=L.units.filter(u=>unitDone(u.id)).length;
  const totalDone=ALL_UNITS.filter(u=>unitDone(u.id)).length;
  const avg=avgScore();
  const errs=Object.entries(P.errors).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const fresh=P.history.length===0;
  const nextBlock = nu
    ? `<div class="label">Tu próximo paso · Unidad ${nu.n} de 8</div><h1>${esc(nu.t)}</h1><p class="muted">${esc(nu.g)} · ${esc(nu.tech)}</p>
       <div class="row"><button class="btn primary" data-act="open" data-id="${nu.id}">${P.units[nu.id]?"Continuar unidad":"Empezar unidad"}</button><button class="btn" data-act="go" data-v="talk">Practicar conversación</button></div>`
    : `<div class="label">Completaste todas las unidades de ${L.code}</div><h1>Rendí el examen de nivel ${L.code}</h1><p class="muted">Si sacás ${EXAM_PASS} o más, se desbloquea el nivel ${LEVELS[li+1]?LEVELS[li+1].code:"final"}.</p>
       <div class="row"><button class="btn primary" data-act="exam" data-l="${L.code}">Ir al examen</button></div>`;

    <div class="levelmark">${L.code}<small>${L.name}</small></div>

      ${nextBlock}
      <div class="row" style="gap:12px"><div class="bar" style="flex:1;min-width:120px"><span style="width:${done/8*100}%"></span></div><span class="mono">${done}/8 unidades de ${L.code}</span></div>
    </div>
  </section>
  ${(()=>{ const n=srsDue().length; return n?`<section class="card row" style="justify-content:space-between"><div><h3>Repaso de hoy</h3><p class="muted">${n} tarjeta${n===1?"":"s"} de vocabulario y errores para fijar · unos ${Math.max(1,Math.round(Math.min(n,SRS_SESSION)*0.4))} min</p></div><button class="btn primary" data-act="rvstart">Repasar ahora</button></section>`:""; })()}
  ${fresh?`<div class="note"><b>¿Cómo funciona?</b> Cada unidad tiene una explicación, vocabulario con audio, un diálogo, ejercicios autocorregidos, una escucha con dictado, práctica de pronunciación con micrófono y una escritura que corrige el tutor IA. La unidad se completa con ${QUIZ_PASS}% o más en los ejercicios y ${WRITE_PASS} o más en la escritura. Al terminar las 8 unidades rendís el examen de nivel, y el tutor analiza tus errores para armarte un plan semanal.</div>`:""}
  <section class="stats">
    <div class="stat"><span class="label">Unidades</span><b>${totalDone}<span class="muted" style="font-size:1rem"> / 48</span></b></div>
    <div class="stat"><span class="label">Promedio</span><b>${avg==null?"—":avg}</b></div>
    <div class="stat"><span class="label">Racha</span><b>${P.streak.count||0} <span class="muted" style="font-size:1rem">${P.streak.count===1?"día":"días"}</span></b></div>
    <div class="stat"><span class="label">Conversaciones</span><b>${P.chats||0}</b></div>
  </section>
  <section class="card stack"><div class="row" style="justify-content:space-between"><h3>Tu camino A1 → C2</h3><span class="mono muted">Las ofertas remotas suelen pedir B2</span></div>${ladderHTML()}</section>
  <div class="grid2">
    <section class="card stack">
      <h3>Diagnóstico del tutor</h3>

      <h3>Puntos a reforzar</h3>
      ${errs.length?`<div class="chips">${errs.map(([c,n])=>`<span class="chip">${esc(c)}<b>×${n}</b></span>`).join("")}</div><p class="muted" style="font-size:.9rem">Errores que detectó el tutor en tus escrituras y conversaciones.</p>`:`<p class="muted">Todavía no hay datos. Cuando el tutor corrija tu primera escritura, acá vas a ver tus errores más frecuentes.</p>`}
      <h3 style="margin-top:8px">Registro de actividad</h3>
      ${P.history.length?`<ul class="log">${P.history.slice(0,8).map(h=>`<li><span class="h">${esc(h.ref)}</span><span>${esc(h.label)}</span><span class="s">${h.score}${h.type==="unit"?"":"/100"} · ${ago(h.at)}</span></li>`).join("")}</ul>`:`<p class="muted">Tu actividad va a aparecer acá.</p>`}
    </section>
  </div>
  ${reportsCard()}`;
}
let coachBusy=false, coachErr="", coachLive="";
function coachHTML(){
  if(coachBusy) return `<div class="thinking"><span class="dot"></span>El tutor está revisando tu progreso…</div>${coachLive?`<div class="coach">${esc(coachLive)}</div>`:""}`;
  const c=P.coach;
  return `${c?`<div class="coach">${esc(c.text)}</div><span class="mono muted">Generado ${ago(c.at)}</span>`:`<p class="muted">El tutor lee tus puntajes, tus errores y tu ritmo, y te arma prioridades y un plan para los próximos 7 días.</p>`}
  ${coachErr?`<p class="errtxt">${esc(coachErr)}</p>`:""}
  <div class="row"><button class="btn ${c?"":"primary"}" data-act="coach" ${aiReady()?"":"disabled"}>${c?"Actualizar diagnóstico":"Pedir diagnóstico"}</button></div>`;
}
async function runCoach(){
  if(!aiReady()) return;
  coachBusy=true; coachErr=""; coachLive=""; render();
  const L=LEVELS[currentLevel()];
  const summary={
    nivel_actual:L.code, horas_por_semana:P.hours, racha_dias:P.streak.count||0, conversaciones:P.chats||0,
    niveles_aprobados:Object.entries(P.levels).filter(([k,v])=>v.passed).map(([k,v])=>k+" ("+v.score+")"),
    unidades:Object.entries(P.units).map(([k,v])=>({unidad:k,titulo:unitById(k)?.t,ejercicios:v.quiz??null,escritura:v.writing??null,completa:!!v.done})),
    errores_frecuentes:P.errors,
    actividad_reciente:P.history.slice(0,15).map(h=>({fecha:h.at.slice(0,10),tipo:h.label,ref:h.ref,puntaje:h.score})),
    proxima_unidad:nextUnit()?.t||"examen de nivel"
  };
  const prompt=`Sos el tutor de inglés de un hispanohablante que empezó de cero y quiere trabajar como ingeniero en sistemas en empresas internacionales, además de poder conversar con fluidez. Analizá su progreso (JSON abajo) y escribí en español, en texto plano sin markdown (sin asteriscos ni #), máximo 220 palabras:

  const r=await SAMPLE.json(prompt,{cache:false,modelTier:"default"});

async function evalWriting(){

async function evaluateText(text,task,lvl,minW,taught){
  const prompt=`Sos evaluador de inglés (MCER) para hispanohablantes. Nivel del alumno: ${lvl}, pero todavía no vio todo ese nivel. Lo que ya estudió:
<<<
${taught}
>>>
${SEEN_RULE}

<<<
${text.slice(0,6000)}
>>>
Respondé SOLO JSON: {"score": número 0-100, "strengths":"1-2 frases en español sobre lo que hizo bien", "errors":[{"original":"fragmento exacto con error","fix":"versión correcta","why":"explicación breve en español","category":"una de: ${CATS.join(" | ")}","seen":true o false}], "corrected":"el texto completo corregido, manteniendo sus ideas", "next":"un consejo concreto en español para mejorar"}

  const r=await SAMPLE.json(prompt,{modelTier:"default"});
  const score=Math.max(0,Math.min(100,Math.round(Number(r&&r.score)||0)));
  return {id:Date.now(),score,strengths:String(r.strengths||""),errors:Array.isArray(r.errors)?r.errors.filter(e=>e&&e.original).slice(0,10).map(e=>Object.assign(e,{seen:!(e.seen===false||e.seen==="false")})):[],corrected:String(r.corrected||""),next:String(r.next||"")};
}

async function submitExam(){
  const st=EST, L=LEVELS[levelIdx(st.level)], ex=st.exam;

    addErrors(w.errors); log("exam",L.code,final,"Examen de nivel");
    srsAddErrors(L.code+"-EX",w.errors);
    ex.questions.forEach((x,i)=>{ if(!reported(exKey("E",i))&&!isRight(x,st.ans[i])) srsPutEx(L.code+"-EX",x); });
    srsSave();

  }catch(e){ st.err=aiErr(e); }
  st.busy=""; render();
}

    <section class="card stack"><h3>Semana tipo (~${h} h)</h3>
      <div class="week">
        <div><b>Lun</b><span>Unidad nueva: explicación, gramática y vocabulario con audio</span><span class="mono muted">${Math.round(h*60*.2)}′</span></div>
        <div><b>Mar</b><span>Ejercicios y escritura corregida por el tutor</span><span class="mono muted">${Math.round(h*60*.15)}′</span></div>
        <div><b>Mié</b><span>Conversación con Sam sobre el escenario de la unidad</span><span class="mono muted">${Math.round(h*60*.15)}′</span></div>
        <div><b>Jue</b><span>Track técnico: leer un README o documentación en inglés y anotar 10 palabras</span><span class="mono muted">${Math.round(h*60*.15)}′</span></div>
        <div><b>Vie</b><span>Repaso de vocabulario y otra conversación (daily o entrevista)</span><span class="mono muted">${Math.round(h*60*.15)}′</span></div>
        <div><b>Sáb</b><span>Inglés real: serie, video o podcast con subtítulos en inglés</span><span class="mono muted">${Math.round(h*60*.2)}′</span></div>
        <div><b>Dom</b><span>Descanso. Pedile el diagnóstico al tutor y planificá la semana</span><span class="mono muted">5′</span></div>
      </div>
    </section>
    <section class="card stack"><h3>Dos caminos en paralelo</h3>
      <p><b>Inglés para la vida:</b> conversación, escucha y vocabulario diario. Es la base de todo y te da fluidez para charlar con cualquiera.</p>
      <p><b>Inglés para trabajar en tech:</b> cada unidad agrega un enfoque técnico, desde deletrear tu usuario (A1) hasta dailies (B1), code reviews y entrevistas técnicas (B2), y negociar una oferta (C1).</p>
      <h3 style="margin-top:6px">Hitos laborales</h3>
      <ul class="plain">
        <li><b>A2:</b> leer documentación simple y escribir mensajes cortos en Slack.</li>
        <li><b>B1:</b> participar en dailies y pasar una primera entrevista con RR. HH.</li>
        <li><b>B2:</b> entrevistas técnicas y trabajo diario en equipos internacionales.</li>
        <li><b>C1:</b> liderar reuniones, presentar y negociar condiciones.</li>
      </ul>
    </section>
  </div>
  <section class="card stack"><h3>Recursos gratuitos para complementar</h3>
    <ul class="plain">
      <li><a href="https://www.bbc.co.uk/learningenglish" target="_blank" rel="noopener">BBC Learning English</a>: cursos por nivel, audio y videos cortos.</li>
      <li><a href="https://youglish.com" target="_blank" rel="noopener">YouGlish</a>: escuchá cómo pronuncian una palabra en videos reales, por ejemplo "cache" o "queue".</li>
      <li><a href="https://apps.ankiweb.net" target="_blank" rel="noopener">Anki</a>: tarjetas de repaso espaciado para el vocabulario de cada unidad.</li>
      <li><a href="https://writeandimprove.com" target="_blank" rel="noopener">Write &amp; Improve (Cambridge)</a>: más práctica de escritura con corrección automática.</li>
      <li>Desde B1: charlas de conferencias en YouTube (con subtítulos en inglés) y la documentación oficial de tus herramientas, como MDN o la de Python.</li>
    </ul>
  </section>`;
}

/* ============ EVENTOS ============ */
const actions={
  go:d=>go(d.v),
  open:d=>go("lesson",{id:d.id}),
  exam:d=>go("exam",{level:d.l}),
  say:d=>speak(d.t,d.r?+d.r:undefined),
  hush:()=>{ try{ speechSynthesis.cancel(); }catch(e){} },
  genprac:()=>genPractice(),
  lplay:d=>{ const st=LST; if(!st||!st.practice) return; st.lis.plays++; speakLines(st.practice.listen.lines,d.r?+d.r:.9); const el=$("#lplays"); if(el) el.textContent="Escuchado "+st.lis.plays+(st.lis.plays===1?" vez":" veces"); },
  lpick:d=>{ if(!LST||LST.lis.checked) return; LST.lis.ans[+d.i]=+d.o; render(); },
  lcheck:()=>checkListen(),
  lretry:()=>{ if(!LST) return; LST.lis={ans:{},dict:{},checked:false,plays:LST.lis.plays}; render(); },
  prmic:d=>{ if(LST&&LST.pr.rec===+d.i&&REC){ try{ REC.stop(); }catch(e){} return; } prListen(+d.i); },
  prcmp:d=>{ if(!LST) return; const v=(LST.pr.inp[+d.i]||"").trim(); if(!v){ const t=$("#p-"+d.i); if(t) t.focus(); return; } prRecord(+d.i,v); },
  prmode:d=>{ setPrMode(d.m); if(LST) LST.pr.err=""; render(); },
  coach:()=>runCoach(),
  gen:()=>genLesson(),
  pick:d=>{ const st=d.k==="E"?EST:LST; if(!st) return; st.ans[+d.i]=+d.o;
    const exs=d.k==="E"?EST.exam.questions:LST.lesson.exercises; const box=$("#ex-"+d.k);
    if(box) box.innerHTML=exHTML(exs,d.k==="E"?{ans:EST.ans,checked:false}:LST,d.k); updAnsCount(); },
  check:()=>checkLesson(),
  retry:()=>{ LST.ans={}; LST.checked=false; render(); },
  evalw:()=>evalWriting(),
  genexam:()=>genExam(),
  submitexam:()=>submitExam(),
  talkunit:d=>{ TST={scen:"unit",unitId:d.id,level:unitById(d.id).level,turns:[],busy:false,err:"",evalRes:null,draft:""}; go("talk"); },
  tlevel:d=>{ if(TST.busy) return; TST.level=d.l; TST.turns=[]; TST.evalRes=null; render(); },
  scen:d=>{ if(TST.busy) return; TST.scen=d.s; TST.turns=[]; TST.evalRes=null; TST.err=""; render(); },
  treset:()=>{ if(TST.busy) return; TST.turns=[]; TST.evalRes=null; TST.err=""; render(); },
  tstart:()=>talkCall(),
  tsend:()=>talkSend(),
  teval:()=>talkEval(),
  hours:d=>{ P.hours=+d.h; save(); render(); },
  repopen:d=>{ RPT={open:d.key,draft:""}; render(); const t=$("#rep-note"); if(t) t.focus(); },
  repcancel:()=>{ RPT={open:null,draft:""}; render(); },
  repsend:d=>sendReport(d.key),
  repdel:d=>{ REPORTS=REPORTS.filter(r=>r.key!==d.key); saveReports(); render(); },
  rvstart:()=>rvStart(),
  rvshow:()=>rvShow(),
  rvcheck:()=>rvCheck(),
  rvnext:()=>rvGrade(RV&&RV.right?2:0),
  rvgrade:d=>rvGrade(+d.g),
  rvpick:d=>{ if(!RV||RV.rev) return; RV.ans=+d.o; render(); },
  rvdrop:()=>rvDrop(),
  rvquit:()=>{ if(!RV) return; RV.queue=RV.queue.slice(0,RV.i); RV.i=Math.max(0,RV.i-1); rvAdvance(); }
};
function updAnsCount(){ const el=$("#ans-count"); if(el&&LST&&LST.lesson) el.textContent=Object.keys(LST.ans).filter(i=>LST.ans[i]!==""&&LST.ans[i]!=null).length+"/"+LST.lesson.exercises.length+" respondidas"; }
document.addEventListener("click",e=>{ const b=e.target.closest("[data-act]"); if(!b||b.disabled) return; const f=actions[b.dataset.act]; if(f) f(b.dataset,b); });
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.dataset.fk){ const st=t.dataset.fk==="E"?EST:LST; if(st) st.ans[+t.dataset.fi]=t.value; updAnsCount(); }
  if(t.id==="writing"&&LST){ LST.writing=t.value; const w=$("#wc"); if(w) w.textContent=words(t.value)+" palabras"; }
  if(t.id==="exwriting"&&EST){ EST.writing=t.value; const w=$("#exwc"); if(w) w.textContent=words(t.value)+" palabras"; }
  if(t.dataset.dk&&LST) LST.lis.dict[+t.dataset.dk]=t.value;
  if(t.dataset.pk&&LST) LST.pr.inp[+t.dataset.pk]=t.value;
  if(t.id==="talk-in") TST.draft=t.value;
  if(t.id==="rep-note") RPT.draft=t.value;
  if(t.id==="rv-in"&&RV) RV.input=t.value;
});
document.addEventListener("keydown",e=>{ if(e.target.id==="talk-in"&&e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); talkSend(); } });
// Atajos del repaso: Espacio / Enter para mostrar o comprobar, 1-2-3 para calificar.
document.addEventListener("keydown",e=>{
  if(view.name!=="review"||!rvCur()||e.ctrlKey||e.metaKey||e.altKey) return;
  const c=rvCur(), tg=e.target.tagName;
  if(e.target.id==="rv-in"){ if(e.key==="Enter"){ e.preventDefault(); c.t==="x"?rvCheck():rvShow(); } return; }
  if(tg==="INPUT"||tg==="TEXTAREA") return;
  if((e.key===" "||e.key==="Enter")&&tg!=="BUTTON"&&tg!=="A"){ e.preventDefault(); if(!RV.rev) c.t==="x"?rvCheck():rvShow(); else if(c.t==="x") rvGrade(RV.right?2:0); return; }
  if(RV.rev&&c.t!=="x"&&["1","2","3"].includes(e.key)){ e.preventDefault(); rvGrade(+e.key-1); }
});

/* ============ INICIO ============ */
async function init(){
  const local=lsGet(LS_KEY); if(local&&typeof local==="object") P=Object.assign(DEFAULT_P(),local);
  const lr=lsGet(RLS); if(Array.isArray(lr)) REPORTS=lr;
  const ls=lsGet(SRS_LS); if(ls&&typeof ls==="object"&&!Array.isArray(ls)) SRS=ls;
  render();
  if(!window.claude||!window.claude.use){ aiState="off"; renderStatus(); srsBackfill(); return; }
  const [u,db,s]=await Promise.all([claude.use("user").catch(()=>null),claude.use("db").catch(()=>null),claude.use("sample").catch(()=>null)]);
  SAMPLE=s; aiState=s?"on":"off";
  if(u&&db){
    try{ UID=await u.id(); }catch(e){ UID=null; }
    if(UID){
      DB=db;
      try{
        const snap=await db.doc(`data/users/${UID}/progress`).get();
        if(snap.exists){ P=Object.assign(DEFAULT_P(),clone(snap.data())); lsSet(LS_KEY,P); syncState="ok"; }
        else { syncState="ok"; if(local) save(); }
      }catch(e){ syncState="err"; }
      await loadReports();
      await srsLoad();
    }
  }
  srsBackfill();
  // no re-render the lesson/exam mid-typing; refresh only views that show progress
  if(view.name==="lesson"&&LST){ LST.lesson=undefined; if(!LST.pbusy){ LST.practice=undefined; LST.pload=false; } }
  render();
}
init();
</script>
